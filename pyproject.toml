[project]
name = "rollslope-quant"
version = "0.1.0"
description = "RollSlope Quant automated trading architecture with Plutus router agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pwlf>=2.2.1",
    "shioaji>=1.2.0",
    "pytest-asyncio>=0.23",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
